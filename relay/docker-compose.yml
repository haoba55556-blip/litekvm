# LiteKVM self-hosted relay — docker compose up -d
services:
  relay:
    build: .
    image: litekvm/relay:latest
    container_name: litekvm-relay
    ports:
      - "25910:25910"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
